    <div class="messageForm" id="messageForm">
   
        <h3 style="text-align: center;padding-top:25px;">Send us a Message</h3>
        <form>
            <table>
            <tbody>
                <tr>
                    <td colspan="1"><label for ="fname">First Name</label></td><td colspan="2"><input class="formInput" type="text" required name="fname"/></td>
                </tr>
                <tr>
                    <td colspan="1"><label for ="lname">Last Name</label></td><td colspan="2"><input class="formInput" type="text" required name="lname"/></td>
                </tr>
                <tr>
                    <td><label for ="phone">Phone</label></td><td><input class="formInput" type="tel" required name="phone"/></td>
                </tr>
                <tr>
                    <td><label for ="email">Email</label></td><td><input class="formInput" type="email" required name="email"/></td>
                </tr>
                <tr>
                    <td><label for ="subject">Message Subject</label></td><td><input class="formInput" type="text" required name="subject"/></td>
                </tr>
                <tr>
                    <td><label for ="mess">Message</label></td><td><textarea class="formInput" type="text" required name="mess"></textarea></td>
                </tr>
                <tr>
                    <td colspan="2"><input type="submit" class="formInput" id="submit" value="Send Message"/></td>
                </tr>
                </tbody>
            </table>
            
            
            
        </form>
    </div>
