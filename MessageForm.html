    <div class="messageForm" id="messageForm">
        <h3 class="form-title">Send us a Message</h3>
        <form action="email.php" method="POST">
            <fieldset>
                <legend>Contact Information</legend>
                <label for="Name">Full Name</label>
                <input class="formInput" type="text" id="Name" name="fullname" required minlength="10" placeholder="Enter your full name">
                
                <label for="Phone">Phone</label>
                <input class="formInput" type="tel" id="Phone" name="tel" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="Format: xxx-xxx-xxxx" required>
                
                <label for="Email">Email</label>
                <input class="formInput" type="email" id="Email" name="email" placeholder="Enter your email" required>
            </fieldset>

            <fieldset>
                <legend>Message Details</legend>
                <label for="subject">Message Subject</label>
                <input class="formInput" type="text" id="subject" name="subject" minlength="10" required placeholder="Enter the subject">
                
                <label for="Message">Message</label>
                <textarea class="formInput" id="Message" name="message" minlength="35" required placeholder="Enter your message"></textarea>
            </fieldset>

           
            <div style="width:100%""><button type="submit" id="submit" class="submit"  name="submitForm" aria-label="Send Message" value="Send Message">Send Message</button></div>
         </form>
    </div>
